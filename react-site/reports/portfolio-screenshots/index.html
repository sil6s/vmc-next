<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VMC Portfolio Screenshots</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --ink: #201818;
        --muted: #766b63;
        --line: #d8cec3;
        --card: #ffffff;
        --accent: #9f1f24;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 56px;
      }

      h1,
      h2 {
        margin: 0;
        line-height: 1.05;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3.5rem);
        letter-spacing: 0;
      }

      h2 {
        margin-top: 40px;
        font-size: 1.35rem;
      }

      p {
        color: var(--muted);
        margin: 10px 0 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
        margin-top: 18px;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      figure {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--card);
      }

      img {
        display: block;
        width: 100%;
        height: 360px;
        object-fit: cover;
        object-position: top center;
        background: #fff;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-top: 1px solid var(--line);
        font-size: 0.92rem;
      }

      .tag {
        color: var(--accent);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VMC Portfolio Screenshots</h1>
      <p>Live rebuild screenshots from nky.vet, plus legacy homepage captures from the Wayback Machine.</p>

      <h2>Live Site</h2>
      <div class="grid">
        <a href="live-home-desktop.png"><figure><img src="live-home-desktop.png" alt="Live home desktop" /><figcaption><span>Home</span><span class="tag">Desktop</span></figcaption></figure></a>
        <a href="live-home-mobile.png"><figure><img src="live-home-mobile.png" alt="Live home mobile" /><figcaption><span>Home</span><span class="tag">Mobile</span></figcaption></figure></a>
        <a href="live-services-desktop.png"><figure><img src="live-services-desktop.png" alt="Live services desktop" /><figcaption><span>Services</span><span class="tag">Desktop</span></figcaption></figure></a>
        <a href="live-services-mobile.png"><figure><img src="live-services-mobile.png" alt="Live services mobile" /><figcaption><span>Services</span><span class="tag">Mobile</span></figcaption></figure></a>
        <a href="live-locations-desktop.png"><figure><img src="live-locations-desktop.png" alt="Live locations desktop" /><figcaption><span>Locations</span><span class="tag">Desktop</span></figcaption></figure></a>
        <a href="live-locations-mobile.png"><figure><img src="live-locations-mobile.png" alt="Live locations mobile" /><figcaption><span>Locations</span><span class="tag">Mobile</span></figcaption></figure></a>
        <a href="live-new-patients-desktop.png"><figure><img src="live-new-patients-desktop.png" alt="Live new patients desktop" /><figcaption><span>New Patients</span><span class="tag">Desktop</span></figcaption></figure></a>
        <a href="live-new-patients-mobile.png"><figure><img src="live-new-patients-mobile.png" alt="Live new patients mobile" /><figcaption><span>New Patients</span><span class="tag">Mobile</span></figcaption></figure></a>
        <a href="live-contact-desktop.png"><figure><img src="live-contact-desktop.png" alt="Live contact desktop" /><figcaption><span>Contact</span><span class="tag">Desktop</span></figcaption></figure></a>
        <a href="live-contact-mobile.png"><figure><img src="live-contact-mobile.png" alt="Live contact mobile" /><figcaption><span>Contact</span><span class="tag">Mobile</span></figcaption></figure></a>
        <a href="live-book-appointment-desktop.png"><figure><img src="live-book-appointment-desktop.png" alt="Live book appointment desktop" /><figcaption><span>Book Appointment</span><span class="tag">Desktop</span></figcaption></figure></a>
        <a href="live-book-appointment-mobile.png"><figure><img src="live-book-appointment-mobile.png" alt="Live book appointment mobile" /><figcaption><span>Book Appointment</span><span class="tag">Mobile</span></figcaption></figure></a>
      </div>

      <h2>Legacy Comparison</h2>
      <div class="grid">
        <a href="legacy-home-desktop.png"><figure><img src="legacy-home-desktop.png" alt="Legacy home desktop" /><figcaption><span>Legacy Home</span><span class="tag">Desktop</span></figcaption></figure></a>
        <a href="legacy-home-mobile.png"><figure><img src="legacy-home-mobile.png" alt="Legacy home mobile" /><figcaption><span>Legacy Home</span><span class="tag">Mobile</span></figcaption></figure></a>
      </div>
    </main>
  </body>
</html>
